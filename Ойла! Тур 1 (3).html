<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ойла! Тур 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@700;800;900&display=swap">
<style>
/* Layout: колонка до 520px. Сверху переключатель шагов прототипа, дальше три экрана пути ученика: сайт, чат с ботом, Mini App. Игровая подача как в QuizDuel: крупные цветные плитки предметов, объёмные кнопки, раунды по категориям. */
:root{
  --bg:#1a1730; --bg2:#231f45; --surf:#2a2558; --surf2:#383083; --edge:#120f26; --line:#4a42a6;
  --fg:#ffffff; --mut:#b8b2e0;
  --brand:#6835ff;--brand2:#735dfb;--pink:#ff2193;--cta:#ffd815; --cta-edge:#b39500; --cta-ink:#282828;
  --tgb:#2aa3f5; --tgb-edge:#1a74b3;
  --ok:#35d489; --bad:#ff2193;
  --f-disp:"Soyuz Grotesk","Montserrat","Arial Black",system-ui,sans-serif;
  --f-body:-apple-system,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 420px at 50% -80px,rgba(104,53,255,.38),transparent 70%),var(--bg);color:var(--fg);font:16px/1.45 var(--f-body);min-height:100vh;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.3px);background-size:24px 24px;-webkit-mask-image:linear-gradient(#000,transparent 70%);mask-image:linear-gradient(#000,transparent 70%)}
#app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:0 32px;position:relative}
#app.hasnav{padding-bottom:104px}
h1,h2,h3{margin:0;font-family:var(--f-disp);text-wrap:balance}
p{margin:0 0 10px}
.mut{color:var(--mut)}
.row{display:flex;align-items:center;gap:10px}
.lbl{font:800 11px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.sec{font:800 12px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:22px 2px 10px}
.note{border-top:2px solid var(--bg2);margin-top:12px;padding-top:10px;font-size:13px;color:var(--mut)}

/* переключатель шагов прототипа */
#sb{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:6px;align-items:center;padding:10px 0;background:linear-gradient(var(--bg) 72%,transparent)}
#sb .demo{flex:none;font:800 10px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--cta-ink);background:var(--cta);border-radius:6px;padding:4px 6px}
#sb button.st{flex:1;display:flex;gap:5px;justify-content:center;align-items:center;white-space:nowrap;border:2px solid var(--line);background:var(--surf);color:var(--mut);border-radius:12px;padding:8px 2px;font:800 11.5px var(--f-body);cursor:pointer;min-width:0}
#sb button.st b{flex:none;width:18px;height:18px;border-radius:50%;background:var(--line);color:var(--fg);display:grid;place-items:center;font:700 10px var(--f-disp)}
#sb button.st.on{border-color:var(--cta);color:var(--fg)}
#sb button.st.on b{background:var(--cta);color:var(--cta-ink)}
#sb button:disabled{opacity:.35;cursor:default}
#sb .rs{flex:none;background:none;border:0;color:var(--mut);text-decoration:underline;font:700 11px var(--f-body);padding:6px 2px;cursor:pointer}

/* кнопки */
.btn{display:block;border:0;border-radius:14px;padding:14px 18px;font:800 15px var(--f-body);background:var(--cta);color:var(--cta-ink);box-shadow:0 4px 0 var(--cta-edge);cursor:pointer;transition:transform .08s,box-shadow .08s;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--cta-edge)}
.btn.g{background:var(--surf2);color:var(--fg);box-shadow:0 4px 0 var(--edge)}
.btn.g:active{box-shadow:0 1px 0 var(--edge)}
.btn.tb{background:var(--tgb);color:#fff;box-shadow:0 4px 0 var(--tgb-edge)}
.btn.tb:active{box-shadow:0 1px 0 var(--tgb-edge)}
.btn:disabled{opacity:.4;box-shadow:none;transform:none;cursor:default}
.btn.w{width:100%}
.btn:focus-visible,.opt:focus-visible,.dir:focus-visible,nav button:focus-visible,#sb button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #fff;outline-offset:2px}

/* поля */
.card{background:var(--surf);border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 4px 0 var(--edge)}
label.f{display:block;font:700 13px var(--f-body);color:var(--mut);margin:14px 0 6px}
input,select{width:100%;padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg2);color:var(--fg);font:700 16px var(--f-body)}
input:focus,select:focus{border-color:var(--cta)}
::placeholder{color:#8f89cc;font-weight:600}
label.ck{display:flex;gap:10px;align-items:flex-start;font:600 14px var(--f-body);color:var(--fg);margin:12px 0}
input[type=checkbox]{width:20px;height:20px;margin:1px 0 0;accent-color:var(--cta);flex:none}

/* сайт */
.lh{padding:14px 0 4px}
.kick{font:800 11px var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--cta)}
.lh h1{font:800 60px/.95 var(--f-disp);margin:10px 0 12px;letter-spacing:-.01em}
.lead{font-size:17px;color:#dfe2ff;max-width:36ch}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pills span{background:var(--surf);border:2px solid var(--line);border-radius:99px;padding:5px 12px;font:800 12.5px var(--f-body)}
.flow{list-style:none;margin:22px 0 4px;padding:0;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;counter-reset:s}
.flow li{counter-increment:s;background:var(--surf);border:2px solid var(--line);border-radius:14px;padding:10px;position:relative;min-width:0}
.flow li::before{content:counter(s);display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--cta);color:var(--cta-ink);font:800 11px var(--f-disp);margin-bottom:8px}
.flow b{display:block;font-size:13.5px;line-height:1.2}
.flow span{font-size:12px;color:var(--mut)}
.dirs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dir{position:relative;min-height:112px;border:3px solid transparent;border-radius:20px;padding:12px;text-align:left;color:#fff;cursor:pointer;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.42)),linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 4px 0 rgba(0,0,0,.4);display:flex;flex-direction:column;justify-content:space-between;font-family:var(--f-body)}
.dir:last-child{grid-column:1/-1;min-height:92px}
.dir .ics{display:flex;gap:8px}
.dir .dn{font:800 15px/1.15 var(--f-body);text-shadow:0 1px 3px rgba(0,0,0,.45)}
.dir .chk{position:absolute;right:10px;top:10px;width:26px;height:26px;border-radius:50%;background:#fff;color:#16183f;display:none;place-items:center}
.dir.sel{border-color:#fff}
.dir.sel .chk{display:grid}
.okb{width:84px;height:84px;border-radius:50%;background:var(--ok);color:#06301c;display:grid;place-items:center;margin:18px auto 14px;box-shadow:0 5px 0 #1b8f5b}
.ok-h{text-align:center}
.ok-h h2{font:800 24px/1.15 var(--f-disp);margin-bottom:8px}
.link{background:var(--bg2);border:2px dashed var(--line);border-radius:12px;padding:12px;font:700 13px ui-monospace,Menlo,Consolas,monospace;word-break:break-all;margin:10px 0;user-select:all}
.code{font:800 30px var(--f-disp);letter-spacing:.16em;color:var(--cta);text-align:center;margin:6px 0 2px}
.steps{list-style:none;padding:0;margin:10px 0 0;counter-reset:t}
.steps li{counter-increment:t;display:flex;gap:12px;align-items:flex-start;padding:8px 0}
.steps li::before{content:counter(t);flex:none;width:26px;height:26px;border-radius:50%;background:var(--surf2);display:grid;place-items:center;font:800 12px var(--f-disp)}

/* чат с ботом (внешний вид Telegram) */
.tg{border-radius:18px;overflow:hidden;border:2px solid var(--line);background:#0e1621;margin-top:2px}
.tgh{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#17212b;border-bottom:1px solid #0b121a}
.tgh b{display:block;font-size:15px;line-height:1.2}
.tgh small{color:#6d7f91;font-size:12px}
.tgm{padding:14px;display:flex;flex-direction:column;gap:8px;min-height:380px}
.msg{max-width:88%;padding:9px 12px;border-radius:14px;font-size:15px;line-height:1.4;animation:pop .35s both;animation-delay:var(--d,0s);overflow-wrap:anywhere}
.msg.b{background:#182533;border-bottom-left-radius:4px;align-self:flex-start}
.msg.u{background:#2b5278;border-bottom-right-radius:4px;align-self:flex-end}
.msg.s{align-self:center;background:rgba(255,255,255,.08);color:#9fb0c0;font-size:12.5px;border-radius:99px;padding:4px 12px;max-width:100%}
.msg code{font:700 13px ui-monospace,Menlo,monospace;background:rgba(255,255,255,.1);padding:1px 6px;border-radius:4px}
.msg.old{animation:none}
.kv{margin-top:8px;font-size:13.5px;color:#b8c7d6;line-height:1.6}
.ib{display:block;width:100%;margin-top:8px;padding:10px;border:0;border-radius:10px;background:rgba(42,163,245,.18);color:#6cc1ff;font:800 14px var(--f-body);cursor:pointer}
.ib:disabled{cursor:default;color:#9fb0c0;background:rgba(255,255,255,.07)}
.tgf{padding:10px 14px 14px;background:#17212b}
.tgstart{width:100%;border:0;border-radius:10px;background:var(--tgb);color:#fff;padding:13px;font:800 15px var(--f-body);letter-spacing:.1em;cursor:pointer}
.tgin{background:#0e1621;border-radius:20px;padding:11px 16px;color:#6d7f91;font-size:15px}
.chkl{margin:6px 0 0;padding:0;list-style:none;font-size:14px;line-height:1.7}
.chkl li{display:flex;gap:8px;align-items:center}
.chkl i{color:var(--ok);display:inline-flex}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}

/* Mini App */
.who{display:flex;align-items:center;gap:12px;padding:6px 0 14px}
.who small{display:block;color:var(--mut);font-size:13px}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,var(--c1),var(--c2));font:800 18px var(--f-disp);border:3px solid rgba(255,255,255,.2)}
.xp{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surf);border:2px solid var(--line);border-radius:99px;padding:5px 12px;font:800 14px var(--f-disp)}
.xp i{width:14px;height:14px;border-radius:50%;background:var(--cta);box-shadow:inset -2px -2px 0 var(--cta-edge)}
.play{position:relative;overflow:hidden;border-radius:22px;padding:18px;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.4)),linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 5px 0 rgba(0,0,0,.35)}
.play::after{content:"";position:absolute;right:-34px;top:-34px;width:150px;height:150px;border-radius:50%;border:28px solid rgba(255,255,255,.13);pointer-events:none}
.play .lbl{color:#fff;opacity:.85}
.play h2{font:800 24px/1.12 var(--f-disp);margin:8px 0 8px;max-width:14ch}
.play p{max-width:34ch;font-size:14px;opacity:.95;margin-bottom:16px}
.list{background:var(--surf);border:2px solid var(--line);border-radius:18px;box-shadow:0 4px 0 var(--edge);overflow:hidden}
.rowi{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:2px solid var(--bg2)}
.rowi:last-child{border:0}
.rowi>div{min-width:0}
.rowi b{display:block;font-size:15px}
.rowi small{color:var(--mut);font-size:12.5px}
.ci{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--c1);color:#fff;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.rowi.lock .ci{background:var(--surf2);color:var(--mut);box-shadow:none}
.stt{margin-left:auto;flex:none;font:800 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:99px;background:var(--bg2);color:var(--mut)}
.stt.ok{background:rgba(53,212,137,.15);color:var(--ok)}
.stt.am{background:rgba(255,210,63,.15);color:var(--cta)}

/* тур */
.rpill{display:inline-flex;align-items:center;gap:8px;background:var(--rc);padding:6px 12px 6px 8px;border-radius:99px;font:800 13px var(--f-body);box-shadow:inset 0 -3px 0 rgba(0,0,0,.28);color:#fff}
.seg{display:flex;gap:3px;margin:12px 0}
.seg i{flex:1;height:8px;border-radius:4px;background:var(--surf2)}
.seg i.d{background:var(--rc)}
.seg i.c{background:#fff}
.tbar{height:14px;border-radius:8px;background:var(--bg2);border:2px solid var(--line);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--rc);transition:width .25s linear}
.tbar.low i{background:var(--bad)}
.tsec{font:800 20px var(--f-disp);min-width:3.4ch;text-align:right;font-variant-numeric:tabular-nums}
.tsec.low{color:var(--bad)}
.qcard{background:var(--surf);border:2px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 5px 0 var(--edge);user-select:none;-webkit-user-select:none}
.pass{border-left:4px solid var(--rc);background:var(--bg2);padding:10px 12px;border-radius:0 12px 12px 0;color:#dfe2ff;font-size:14.5px;margin:0 0 12px}
pre.cd{background:#0a0c28;border:2px solid var(--line);border-radius:12px;padding:12px;font:700 14px/1.55 ui-monospace,Menlo,Consolas,monospace;overflow-x:auto;margin:0 0 12px;color:#bfe3ff}
.q{font:800 19px/1.3 var(--f-body);margin:0 0 14px;text-wrap:pretty}
.opt{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 10px;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--surf2);color:var(--fg);font:700 16px var(--f-body);text-align:left;cursor:pointer;box-shadow:0 4px 0 var(--edge);transition:transform .08s}
.opt:active{transform:translateY(2px);box-shadow:0 2px 0 var(--edge)}
.opt em{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--bg2);font:800 13px var(--f-disp);font-style:normal;color:var(--mut)}
.opt.s{border-color:var(--rc);background:rgba(255,255,255,.14);background:color-mix(in srgb,var(--rc) 30%,var(--surf2))}
.opt.s em{background:var(--rc);color:#fff}
.rhero{border-radius:22px;padding:26px 20px;text-align:center;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.35)),var(--rc);box-shadow:0 5px 0 rgba(0,0,0,.35);color:#fff}
.rhero .big{width:88px;height:88px;margin:0 auto 14px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center}
.rhero .lbl{color:#fff;opacity:.88}
.rhero h2{font:800 26px/1.12 var(--f-disp);margin:8px 0 6px}
.dots{display:flex;gap:10px;justify-content:center;margin:18px 0 0}
.dots span{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surf2);color:var(--mut)}
.dots span.d{background:var(--c1);color:#fff}
.dots span.c{background:var(--c1);color:#fff;outline:3px solid #fff;outline-offset:2px}
.score{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{width:104px;height:104px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .bg{stroke:var(--bg2)}
.ring .fg{stroke:var(--cta);stroke-linecap:round}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 24px var(--f-disp)}
.rb{display:flex;align-items:center;gap:10px;margin:10px 0}
.rb .ci{width:34px;height:34px}
.rb .bar{flex:1;height:10px;border-radius:5px;background:var(--bg2);overflow:hidden}
.rb .bar i{display:block;height:100%;background:var(--c1)}
.rb span.v{font:800 13px var(--f-disp);min-width:3.2ch;text-align:right}
.kvt{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kvt span:nth-child(odd){color:var(--mut)}
.kvt span:nth-child(even){text-align:right;font-weight:800;overflow-wrap:anywhere}
.warn{border:2px solid var(--bad);background:rgba(255,90,106,.1);border-radius:12px;padding:10px 12px;margin:12px 0;font-size:14px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs .btn{flex:1;padding:10px 6px;font-size:13px}
.pod{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end;text-align:center;margin:6px 0 10px}
.pod>div{display:flex;flex-direction:column;justify-content:flex-end;min-width:0}
.pod .nm{font:800 13px var(--f-body);overflow-wrap:anywhere}
.pod .pt{font:700 12px var(--f-disp);color:var(--mut);margin:2px 0 5px}
.pod .blk{border-radius:10px 10px 0 0;background:var(--surf2);display:grid;place-items:center;font:800 30px var(--f-disp);color:var(--mut)}
.pod .p1 .blk{height:96px;background:var(--cta);color:var(--cta-ink)}
.pod .p2 .blk{height:70px}.pod .p3 .blk{height:52px}
.pod .me .blk{outline:3px solid #fff}
.rk{display:flex;gap:12px;padding:11px 8px;border-bottom:2px solid var(--bg2);align-items:center}
.rk:last-child{border:0}
.rk .n{width:26px;font:800 13px var(--f-disp);color:var(--mut)}
.rk.me{background:rgba(255,210,63,.12);border-radius:10px;border-bottom-color:transparent}
.rk .p{margin-left:auto;font:800 13px var(--f-disp)}
.slots{display:flex;gap:6px;margin:12px 0 4px}
.slots i{flex:1;height:30px;border:2px dashed var(--line);border-radius:8px}
.slots i.d{border:2px solid var(--cta);background:rgba(255,210,63,.15)}

/* пилюля навигации */
nav{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:0 16px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
nav>div{pointer-events:auto;display:flex;max-width:440px;margin:0 auto;background:rgba(42,37,88,.96);border:2px solid var(--line);border-radius:30px;padding:6px;gap:4px;box-shadow:0 8px 24px rgba(0,0,0,.45);backdrop-filter:blur(10px)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:8px 0 6px;border-radius:24px;font:800 10.5px var(--f-body);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
nav button.on{color:var(--cta);background:var(--bg2)}
.mini{display:block;width:24px;height:24px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,var(--c1),var(--c2))}
.mini svg,.av svg{display:block;width:100%;height:100%}
.av{overflow:hidden}
.seg2{display:flex;gap:8px;margin-top:8px}
.chip{flex:1;border:2px solid var(--line);background:var(--bg2);color:var(--mut);border-radius:12px;padding:11px;font:800 14px var(--f-body);cursor:pointer}
.chip.on{border-color:var(--cta);color:var(--fg);background:var(--surf2)}
/* онбординг */
.obh{display:flex;align-items:center;gap:12px;padding:8px 0 18px}
.obh .back{flex:none;width:38px;height:38px;border:0;border-radius:50%;background:var(--surf);color:var(--fg);display:grid;place-items:center;cursor:pointer}
.prog{flex:1;height:8px;border-radius:5px;background:var(--surf2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--cta);border-radius:5px;transition:width .3s}
.ob h2{font:800 25px/1.15 var(--f-disp);margin-bottom:8px}
.srch{display:flex;align-items:center;gap:10px;background:var(--surf);border:2px solid var(--line);border-radius:16px;padding:0 14px;color:var(--mut);margin:14px 0 12px}
.srch input{border:0;background:none;padding:14px 0;flex:1;min-width:0}
.cl{display:flex;flex-direction:column;gap:10px;margin-bottom:100px}
.cty{display:flex;flex-direction:column;align-items:flex-start;text-align:left;width:100%;border:2px solid var(--line);background:var(--surf);color:var(--fg);border-radius:16px;padding:12px 16px;cursor:pointer;font-family:var(--f-body)}
.cty b{font-size:16px}
.cty small{color:var(--mut);font-size:12.5px}
.cty.sel{border-color:var(--cta);background:var(--surf2)}
.cells{display:flex;gap:8px;margin:18px 0}

.stick{position:fixed;left:0;right:0;bottom:0;z-index:14;padding:22px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 40%)}

.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:2px 0 14px}

.map{border-radius:22px;overflow:hidden;border:2px solid var(--line);background:linear-gradient(180deg,#2a2558,#1a1730);box-shadow:0 5px 0 var(--edge)}

.nodeg{cursor:pointer;outline:none}
.nodeg:focus-visible circle:not(.pr){stroke:#fff;stroke-width:5}
@keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.7);opacity:0}}
.pr{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-out infinite}

.ov{position:fixed;inset:0;z-index:50;background:rgba(5,6,24,.74);display:grid;place-items:center;padding:16px;overflow:auto}

.cardart{position:relative;height:156px;margin:6px 0 14px}

function chalInit(){if(S.chal&&S.chal.day===today())return;const ids=[];TRACKS[S.reg.track].s.forEach(k=>CH[k].forEach((_,i)=>ids.push(k+":"+i)));ids.push("gen:"+Math.floor(Date.now()/864e5)%3);S.chal={day:today(),ids:shuf(ids),i:0,ok:0,ans:[],fin:false};save()}
function chal(){chalInit();const C=S.chal,head=`<div class="obh">${backBtn("go('home')")}<div><div class="lbl">Челлендж дня</div><b style="font:800 18px var(--f-disp)">Миф или правда</b></div><span class="stt am" style="margin-left:auto">${C.ok} верно</span></div>`;
if(C.fin)return head+`<div class="card" style="text-align:center"><div class="lbl">Челлендж выполнен</div><div class="bn" style="margin:14px 0 6px;font-size:44px">${C.ok} из 5</div><p style="font-weight:800">+${C.ok*10} XP · серия ${S.streak} дн.</p><p class="mut" style="font-size:13px">Следующий челлендж откроется завтра. Серия 5 дней подряд даёт ещё +50 XP.</p><button class="btn w" onclick="go('home')">На карту</button></div>`;
const [k,i]=C.ids[C.i].split(":"),st=CH[k][+i],a=C.ans[C.i],S0=k==="gen"?{n:"Общий блок",c:SUBJ.read.c,ic:"read"}:SUBJ[k],dots=C.ids.map((_,j)=>`<i class="${j<C.i?(C.ans[j]?"ok":"no"):j===C.i?"c":""}"></i>`).join("");
return head+`<div class="cdots">${dots}</div><div class="qcard" style="--rc:${S0.c}"><span class="rpill">${icn(S0.ic,18)}${S0.s||S0.n}</span><p class="stm">${esc(st.t)}</p>${a==null?`<div class="tf"><button class="btn myth" onclick="ansC(false)">Миф</button><button class="btn true" onclick="ansC(true)">Правда</button></div>`:`<div class="fbk ${a?"ok":"no"}"><b>${a?"Верно.":"Неверно."}</b> ${esc(st.e)}</div><button class="btn w" onclick="nextC()">${C.i>=4?"Завершить":"Дальше"}</button>`}</div>`}

for(let i=0;i<6;i++){const p=MAP[i],q=MAP[i+1],my=(p[1]+q[1])/2,d=`M${p[0]} ${p[1]}C${p[0]} ${my} ${q[0]} ${my} ${q[0]} ${q[1]}`;
o+=`<path d="${d}" fill="none" stroke="#0f0c20" stroke-width="30" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#4a42a6" stroke-width="2.5" stroke-dasharray="3 9" stroke-linecap="round"/>`;
if(st(i+1)==="done")o+=`<path d="${d}" fill="none" stroke="url(#rd)" stroke-width="6" stroke-linecap="round"/>`}
for(let i=0;i<7;i++){const x=MAP[i][0],y=MAP[i][1],z=st(i),col=cols[i],ic=z==="done"?"ok":z==="cur"?ics[i]:"lock",fill=z==="done"?"#35d489":z==="cur"?col:"#383083",fg=z==="done"?"#06301c":"#fff";

o+=`</g>`}

/* тур 1 */
function newRun(){const rs=roundsOf(S.reg.track),q=[];rs.forEach((k,ri)=>{shuf(BANK[k].map((_,i)=>i)).forEach(i=>q.push({r:ri,k,i,o:shuf([0,1,2,3])}))});return{v:mkToken().slice(0,4),idx:0,phase:"round",qs:0,pick:null,sel:[],ms:[],viol:0,q}}
function olymp(){
if(S.done)return result();
const R=S.run;
if(!R)return intro();
return ({round:roundIntro,q:question,rend:roundEnd})[R.phase](R)}
function intro(){const rs=roundsOf(S.reg.track);
return `<div class="play" style="${grad(S.reg.track)}"><div class="lbl">Тур 1</div><h2>${TRACKS[S.reg.track].n}</h2><p>Четыре раунда по категориям. В каждом три вопроса: лёгкий, средний, сложный.</p></div>
<div class="sec">Раунды</div><div class="list">${rs.map((k,i)=>`<div class="rowi"><span class="ci" style="--c1:${SUBJ[k].c}">${icn(SUBJ[k].ic,22)}</span><div><b>${SUBJ[k].n}</b><small>раунд ${i+1}</small></div></div>`).join("")}</div>
<div class="sec">Правила</div>${rulesCard()}
<button class="btn w" onclick="startTour()">Начать тур</button>`}
function startTour(){S.run=newRun();save();render();window.scrollTo(0,0)}
function startRound(){const R=S.run;R.phase="q";R.qs=Date.now();R.pick=null;save();render()}
function nextRound(){S.run.phase="round";save();render()}
function roundIntro(R){const e=R.q[R.idx],S0=SUBJ[e.k],rd=roundsOf(S.reg.track);
return `<div style="--rc:${S0.c}"><div class="rhero"><div class="big">${icn(S0.ic,46)}</div><div class="lbl">Раунд ${e.r+1} из ${rd.length}</div><h2>${S0.n}</h2><p style="margin:4px 0 0;opacity:.92">Три вопроса: лёгкий, средний, сложный</p></div>
<div class="dots">${rd.map((k,i)=>`<span class="${i<e.r?"d":i===e.r?"c":""}" style="--c1:${SUBJ[k].c}">${icn(SUBJ[k].ic,18)}</span>`).join("")}</div>
<button class="btn w" style="margin-top:20px" onclick="startRound()">Поехали</button></div>`}
function question(R){
const e=R.q[R.idx],S0=SUBJ[e.k],Q=BANK[e.k][e.i],lim=TL[Q.d],rem=Math.max(0,lim-(Date.now()-R.qs)/1000),L="ABCD",rd=roundsOf(S.reg.track),inR=R.q.filter(x=>x.r===e.r),pos=inR.indexOf(e)+1,low=rem<10;
const seg=R.q.map((x,k)=>`<i class="${k<R.idx?"d":k===R.idx?"c":""}" style="--rc:${SUBJ[x.k].c}"></i>`).join("");
return `<div style="--rc:${S0.c}"><div class="row"><span class="rpill">${icn(S0.ic,18)}${S0.s||S0.n}</span><span class="mut" style="margin-left:auto;font-weight:800;font-size:13px">Раунд ${e.r+1} из ${rd.length}</span></div><div class="seg">${seg}</div>
<div class="row" style="gap:12px;margin-bottom:12px"><div class="tbar ${low?"low":""}" id="tbar" style="flex:1"><i style="width:${rem/lim*100}%"></i></div><span class="tsec ${low?"low":""}" id="tsec">${fmtS(rem)}</span></div>
<div class="qcard"><div class="lbl" style="margin-bottom:10px">Вопрос ${pos} из ${inR.length} · ${DL[Q.d]}</div>${Q.t?`<p class="pass">${esc(Q.t)}</p>`:""}${Q.c?`<pre class="cd">${esc(Q.c)}</pre>`:""}<p class="q">${esc(Q.q)}</p>
${e.o.map((j,p)=>`<button class="opt ${R.pick===j?"s":""}" onclick="pick(${j})"><em>${L[p]}</em>${esc(Q.o[j])}</button>`).join("")}
<div class="row" style="margin-top:6px"><button class="btn g" onclick="lock(null)">Пропустить</button><button class="btn" style="flex:1" ${R.pick==null?"disabled":""} onclick="lockPick()">Ответить</button></div>
<div class="note">${R.pick!=null?"выбор сохранён на сервере":"выберите ответ"} · выходов из вкладки: ${R.viol}</div></div></div>`}
function pick(j){S.run.pick=j;save();render()}
function lockPick(){doLock(S.run.pick,Date.now());render();toast("Ответ принят")}
function lock(v){doLock(v,Date.now());render()}
function doLock(sel,at){const R=S.run,e=R.q[R.idx],Q=BANK[e.k][e.i];R.sel[R.idx]=sel;R.ms[R.idx]=Math.max(0,Math.min(TL[Q.d]*1000,at-R.qs));R.pick=null;R.idx++;
if(R.idx>=R.q.length)return finish();
if(R.q[R.idx].r!==e.r)R.phase="rend";else R.qs=at;
save()}
function expire(){const R=S.run;if(!R||R.phase!=="q")return false;let ch=false,g=0;
while(R.phase==="q"&&g++<40){const Q=BANK[R.q[R.idx].k][R.q[R.idx].i],dl=R.qs+TL[Q.d]*1000;if(Date.now()<dl)break;doLock(R.pick==null?null:R.pick,dl);ch=true}
return ch}
function finish(){const R=S.run,rd=roundsOf(S.reg.track);let tot=0,max=0,ms=0,sent=0;
const rounds=rd.map((k,ri)=>{let s=0,m=0;R.q.forEach((e,i)=>{if(e.r!==ri)return;const d=BANK[e.k][e.i].d;m+=d;if(R.sel[i]===0)s+=d;if(R.sel[i]!=null&&R.sel[i]!==undefined)sent++;ms+=R.ms[i]||0});tot+=s;max+=m;return{k,s,m}});
S.done={score:tot,max,rounds,sent,total:R.q.length,ms,viol:R.viol,v:R.v,xp:tot*5+50};
R.phase="done";S.run=null;if(!S.days.includes(today()))S.days.push(today());S.xp+=S.done.xp;S.tab="olymp";save();setTimeout(burst,50)}
function roundEnd(R){const last=R.q[R.idx-1],r=last.r,S0=SUBJ[last.k],ids=R.q.map((x,i)=>i).filter(i=>R.q[i].r===r),sent=ids.filter(i=>R.sel[i]!=null).length;
return `<div style="--rc:${S0.c}"><div class="rhero"><div class="big">${icn("ok",46,3)}</div><div class="lbl">Раунд ${r+1} завершён</div><h2>${S0.n}</h2><p style="margin:4px 0 0;opacity:.92">Ответов отправлено: ${sent} из ${ids.length}</p></div>
<div class="card" style="margin-top:14px"><p style="margin:0;color:var(--mut)">Верные ответы не показываются до закрытия окна тура, чтобы их нельзя было передать другим. Итоги придут в бот и появятся здесь.</p></div>
<button class="btn w" onclick="nextRound()">Дальше: ${SUBJ[R.q[R.idx].k].n}</button></div>`}
function result(){const d=S.done,C=2*Math.PI*45,pct=d.max?d.score/d.max:0,mm=Math.floor(d.ms/60000),ss=String(Math.floor(d.ms/1000%60)).padStart(2,"0");
return `<div class="card"><div class="lbl">Тур 1 · работа сдана</div><div class="score" style="margin-top:12px"><div class="ring"><svg viewBox="0 0 104 104"><circle class="bg" cx="52" cy="52" r="45"/><circle class="fg" cx="52" cy="52" r="45" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"/></svg><b>${d.score}/${d.max}</b></div><div><div style="font:800 26px var(--f-disp)">+${d.xp} XP</div><div class="mut" style="font-size:13px">предварительный балл, демо</div></div></div>
${d.viol>=3?`<div class="warn">Работа передана на ручную проверку: зафиксировано несколько выходов из вкладки. Это не дисквалификация, проверяющий посмотрит журнал.</div>`:""}</div>
<div class="sec">По раундам</div><div class="card">${d.rounds.map(r=>`<div class="rb" style="--c1:${SUBJ[r.k].c}"><span class="ci">${icn(SUBJ[r.k].ic,18)}</span><div style="flex:1;min-width:0"><div style="font:800 13px var(--f-body);margin-bottom:4px">${SUBJ[r.k].s||SUBJ[r.k].n}</div><div class="bar"><i style="width:${r.m?r.s/r.m*100:0}%"></i></div></div><span class="v">${r.s}/${r.m}</span></div>`).join("")}</div>
<div class="sec">Квитанция</div><div class="card"><div class="kvt"><span>Вариант</span><span>${d.v}</span><span>Отправлено ответов</span><span>${d.sent} из ${d.total}</span><span>Время в работе</span><span>${mm}:${ss}</span><span>Выходов из вкладки</span><span>${d.viol}</span><span>Telegram ID</span><span>${fmtId(S.tg.id)}</span></div>
<p class="note">В боевой версии баллы и разбор скрыты до закрытия окна тура. Здесь показаны для демонстрации. Балл: лёгкий вопрос 1, средний 2, сложный 3. При равенстве баллов выше тот, кто быстрее.</p></div>
<button class="btn w" onclick="go('rate')">Смотреть рейтинг</button><button class="btn g w" style="margin-top:12px" onclick="S.xp-=S.done.xp;S.done=null;save();render()">Пройти заново (демо)</button>`}

IC.play=IC.play||'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9v6l5-3z"/>';

const AR=()=>{if(!S.arena)S.arena={open:false,r:1000,w:0,l:0,dd:"",nd:0,duel:null};return S.arena};
const DT=15,DMAX=10,PRIZE=15;

const zoneOf=p=>ZONES.find(z=>p>=z[0]&&p<=z[1]);
const OPPS=[["Алибек К.","Астана"],["Аружан С.","Алматы"],["Динара Т.","Шымкент"],["Рустем Ж.","Караганда"],["Мадина Н.","Актобе"],["Тимур А.","Астана"],["Камила О.","Алматы"],["Данияр С.","Атырау"]];
const LADN=["Айгерим Б.","Нурлан Е.","Алия Т.","Ерлан Д.","Сабина М.","Арман К.","Жанель Р.","Бекзат О.","Томирис А.","Дамир Н.","Аселя К.","Мирас Т.","Іңкәр С.","Ильяс Б.","Назерке Ж.","Рамазан Ш.","Малика Е.","Азамат Ч.","Дана Г.","Али Х.","Салтанат В.","Арсен Л.","Томирис К.","Адиль Р."];
const ladder=()=>LADN.map((n,i)=>[n,1215-i*11-(i%3)*4]);
function arLb(){const A=AR(),me=[esc(S.reg.name.split(" ")[0])+" (вы)",A.r,1];return ladder().concat([me]).sort((a,b)=>b[1]-a[1]).map((r,i)=>[i+1,...r])}
function myPos(){return arLb().find(r=>r[3])}
function startDuel(){const A=AR(),d=today();if(A.dd!==d){A.dd=d;A.nd=0}
if(A.nd>=DMAX)return toast("Лимит дуэлей на сегодня исчерпан");
A.nd++;const ks=TRACKS[S.reg.track].s,pool=[];ks.forEach(k=>BANK[k].forEach((q,i)=>pool.push({k,i})));
const q=shuf(pool).slice(0,5).map(x=>({...x,o:shuf([0,1,2,3])})),op=OPPS[Math.floor(Math.random()*OPPS.length)],acc=.5+Math.random()*.3;
A.duel={ph:"search",t0:Date.now(),q,idx:0,qs:0,rt:0,my:[],op:op,orat:A.r+Math.round(Math.random()*90-35),oT:q.map(()=>3+Math.random()*9),oOk:q.map(()=>Math.random()<acc),done:false};
save();render()}
function dpick(j){const A=AR(),D=A.duel;if(!D||D.ph!=="q")return;const n=Date.now(),el=Math.min(DT,(n-D.qs)/1000);
D.my[D.idx]={p:j,ok:j===0,t:el};D.ph="rev";D.rt=n;save();render()}
const dsc=(ok,t)=>ok?100+Math.round(50*(1-t/DT)):0;
function dtot(D){let a=0,b=0;D.my.forEach((m,i)=>{if(m)a+=dsc(m.ok,m.t)});for(let i=0;i<D.idx+(D.ph==="res"?0:D.ph==="rev"?1:0);i++)b+=dsc(D.oOk[i],D.oT[i]);if(D.ph==="res")b=D.oT.reduce((s,t,i)=>s+dsc(D.oOk[i],t),0);return[a,b]}
function finishDuel(){const A=AR(),D=A.duel;D.ph="res";if(!D.done){D.done=true;const[a,b]=dtot(D);D.a=a;D.b=b;D.d=a>b?24:a<b?-16:0;const old=A.r;A.r=Math.max(0,A.r+D.d);D.pos0=null;if(a>b){A.w++;addXp(20)}else if(a<b){A.l++;addXp(8)}else addXp(8)}}

${A.open?`<button class="btn w" onclick="startDuel()">Найти соперника</button><p class="mut" style="text-align:center;font-size:13px;margin:10px 0 0">Сегодня осталось дуэлей: ${left} из ${DMAX}</p>`:`<div class="card" style="border-style:dashed"><b>Арена откроется после тура 1</b><p class="mut" style="margin:6px 0 12px;font-size:14px">Сюда попадают участники, прошедшие отбор по итогам тура 1. Все получат уведомление в боте.</p><button class="btn g w" onclick="arenaOpen()">Демо: открыть этап 2</button></div>`}
<div class="sec">Таблица арены</div>
<div class="card" style="padding:12px"><div class="row" style="margin-bottom:8px"><b>Ваше место: ${me[0]}</b><span class="mut" style="margin-left:auto;font-size:13px">${z?z[2]:gap+" очк. до призовой зоны"}</span></div>
${L.slice(0,PRIZE+1).map(r=>{const zz=zoneOf(r[0]);return `<div class="arow ${r[3]?"me":""}" style="--z:${zz?zz[4]:"transparent"}"><span class="n">${r[0]}</span><span>${r[1]}</span><span class="zt">${zz?zz[2]:""}</span><span class="p">${r[2]}</span></div>`}).join("")}
${me[0]>PRIZE+1?`<div class="arow me" style="--z:transparent"><span class="n">${me[0]}</span><span>${me[1]}</span><span class="zt"></span><span class="p">${me[2]}</span></div>`:""}</div>
<div class="note" style="border:0">Итоговые места определяются по таблице в день закрытия арены: места 1–3, 4–8 и 9–15. Демо-данные.</div>`}
function dots(D,own){return `<div class="dd">${D.q.map((x,i)=>{let c="";const m=D.my[i];if(own){if(m)c=m.ok?"ok":"bad"}else{const done=i<D.idx||(D.ph==="res")||(D.ph==="rev"&&i===D.idx);if(done)c=D.oOk[i]?"ok":"bad";else if(i===D.idx&&D.ph==="q"&&(Date.now()-D.qs)/1000>=D.oT[i])c="on"}return `<i id="${own?"md":"od"}${i}" class="${c}"></i>`}).join("")}</div>`}
function duelHead(D){const [a,b]=dtot(D);return `<div class="vsb"><div><span class="mini" style="${grad(S.reg.track)}">${avatar(S.av,"100%","14 6 72 72")}</span><b>Вы</b><em>${a}</em>${dots(D,true)}</div><div class="x">VS</div><div class="r"><span class="oi">${esc(D.op[0][0])}</span><b>${esc(D.op[0])}</b><em>${b}</em>${dots(D,false)}</div></div>`}
function duelView(){const D=AR().duel;
if(D.ph==="search")return `<div class="srch2"><div class="rings"><i></i><i></i><span>${logo(64)}</span></div><h2>Ищем соперника</h2><p class="mut">Подбираем игрока с близким рейтингом из вашей лиги</p></div>`;
if(D.ph==="vs")return `<div class="vsc"><div class="lbl" style="text-align:center">Дуэль найдена</div><div class="vsr"><div><span class="mini big" style="${grad(S.reg.track)}">${avatar(S.av,"100%","14 6 72 72")}</span><b>Вы</b><small>${esc(S.reg.city)}</small><em>${AR().r}</em></div><div class="x">VS</div><div><span class="oi big">${esc(D.op[0][0])}</span><b>${esc(D.op[0])}</b><small>${esc(D.op[1])}</small><em>${D.orat}</em></div></div><p class="mut" style="text-align:center">5 вопросов · ${DT} сек на каждый</p></div>`;
if(D.ph==="res"){const w=D.a>D.b,t=D.a===D.b,p=myPos(),z=zoneOf(p[0]);
return `<div class="rhero" style="--rc:${w?"#2f9e6a":t?"#5d55c4":"#b3125f"}"><div class="lbl">Дуэль завершена</div><h2>${w?"Победа":t?"Ничья":"Поражение"}</h2><div class="sc">${D.a}<small>:</small>${D.b}</div><p style="margin:6px 0 0">Рейтинг ${D.d>0?"+":""}${D.d} · теперь ${AR().r}</p></div>
<div class="card" style="margin-top:14px"><div class="row"><b>Место в таблице: ${p[0]}</b><span class="mut" style="margin-left:auto;font-size:13px">${z?z[2]:"вне призовой зоны"}</span></div>${dots(D,true)}</div>
<button class="btn w" onclick="startDuel()">Реванш или новый соперник</button><button class="btn g w" style="margin-top:12px" onclick="AR().duel=null;save();render()">В Арену</button>`}
const e=D.q[D.idx],S0=SUBJ[e.k],Q=BANK[e.k][e.i],el=Math.min(DT,(Date.now()-D.qs)/1000),rem=DT-el,L="ABCD",rev=D.ph==="rev",m=D.my[D.idx];
return `<div style="--rc:${S0.c}">${duelHead(D)}<div class="row" style="gap:12px;margin:12px 0"><div class="tbar ${rem<5?"low":""}" id="dbar" style="flex:1"><i style="width:${rem/DT*100}%"></i></div><span class="tsec ${rem<5?"low":""}" id="dsec">${Math.ceil(rem)}</span></div>
<div class="qcard"><div class="lbl" style="margin-bottom:10px">Вопрос ${D.idx+1} из ${D.q.length} · ${S0.s||S0.n}</div>${Q.t?`<p class="pass">${esc(Q.t)}</p>`:""}${Q.c?`<pre class="cd">${esc(Q.c)}</pre>`:""}<p class="q">${esc(Q.q)}</p>
${e.o.map((j,p)=>`<button class="opt ${rev&&j===0?"dok":rev&&m&&m.p===j?"dbad":""}" ${rev?"disabled":""} onclick="dpick(${j})"><em>${L[p]}</em>${esc(Q.o[j])}</button>`).join("")}
${rev?`<div class="note" style="border:0;margin:0">${m&&m.ok?"Верно, +"+dsc(true,m.t):"Мимо, +0"} · соперник: ${D.oOk[D.idx]?"верно":"мимо"}</div>`:""}</div></div>`}
function arena(){const D=AR().duel;return D?duelView():arenaHome()}
setInterval(()=>{const D=S.arena&&S.arena.duel;if(!D||S.screen!=="app"||S.tab!=="arena")return;const n=Date.now();
if(D.ph==="search"&&n-D.t0>1600){D.ph="vs";D.t0=n;save();render()}
else if(D.ph==="vs"&&n-D.t0>1800){D.ph="q";D.qs=n;save();render()}
else if(D.ph==="q"){const el=(n-D.qs)/1000;if(el>=DT){dpick(null);return}
const b=$("#dbar"),t=$("#dsec");if(b){b.firstElementChild.style.width=(DT-el)/DT*100+"%";b.classList.toggle("low",DT-el<5)}if(t){t.textContent=Math.ceil(DT-el);t.classList.toggle("low",DT-el<5)}
const o=$("#od"+D.idx);if(o&&el>=D.oT[D.idx])o.classList.add("on")}
else if(D.ph==="rev"&&n-D.rt>1300){D.idx++;if(D.idx>=D.q.length)finishDuel();else{D.ph="q";D.qs=n}save();render()}},200);
setInterval(()=>{const R=S.run;if(!R||R.phase!=="q"||S.screen!=="app"||S.tab!=="olymp")return;
if(expire()){render();return}
const e=R.q[R.idx],Q=BANK[e.k][e.i],lim=TL[Q.d],rem=Math.max(0,lim-(Date.now()-R.qs)/1000),b=$("#tbar"),t=$("#tsec");
if(b){b.firstElementChild.style.width=rem/lim*100+"%";b.classList.toggle("low",rem<10)}
if(t){t.textContent=fmtS(rem);t.classList.toggle("low",rem<10)}},250);
document.addEventListener("visibilitychange",()=>{if(S.run&&S.run.phase==="q"&&document.hidden){S.run.viol++;save()}});
document.addEventListener("contextmenu",e=>{if(S.run&&S.run.phase==="q")e.preventDefault()});
document.addEventListener("copy",e=>{if(S.run&&S.run.phase==="q")e.preventDefault()});
expire();render();
</script>

</body></html>
